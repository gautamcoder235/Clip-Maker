name: 🐛 Bug Report
description: Report a reproducible bug or unexpected error in Clip Maker
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this issue! Please check existing issues first to avoid duplicates.
  - type: input
    id: version
    attributes:
      label: Clip Maker Version
      description: What version of Clip Maker are you using? (e.g., v1.3.5)
      placeholder: "1.3.5"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows 11
        - Windows 10
        - Other (specify in description)
    validations:
      required: true
  - type: input
    id: ffmpeg-version
    attributes:
      label: FFmpeg Version
      description: Run `ffmpeg -version` in terminal and paste the version string
      placeholder: "ffmpeg version 7.x..."
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what happened.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to trigger the behavior.
      placeholder: |
        1. Import a video file (.mp4)
        2. Set aspect ratio to 9:16
        3. Click Live Preview
        4. See error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or Console Output
      description: Paste any error messages, dev tools console logs, or ffmpeg.log lines here.
      render: shell
