[package]
name = "clip-maker"
version = "1.3.5"
description = "High-performance desktop video clip maker for YouTube Shorts, Reels, and TikTok"
authors = ["Gautam Sharma <sharmagautamkumar235@gmail.com>"]
edition = "2021"
license = "MIT"
repository = "https://github.com/gautamcoder235/Clip-Maker"
homepage = "https://github.com/gautamcoder235/Clip-Maker"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
csv = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
zip = "2.2"


